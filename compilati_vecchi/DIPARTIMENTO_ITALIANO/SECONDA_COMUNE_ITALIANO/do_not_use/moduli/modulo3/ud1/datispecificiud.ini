@Scrivere testi di vario tipo, essenzialmente corretti dal punto di vista morfosintattico, lessicale, ortografico. Applica procedure di pianificazione, stesura e revisione del testo in relazione ad alcune tipologie testuali. Adeguare il registro linguistico nell'ambito di alcune situazioni comunicative. Utilizzare un lessico essenziale ma adeguato, in relazione allo scopo comunicativo e al destinatario.
@Scrivere testi di vario tipo, generalmente corretti dal punto di vista morfosintattico, lessicale, ortografico. Scrivere testi di tipo diverso, coerenti e coesi, adeguati allo scopo e al destinatario. Applicare procedure di pianificazione, stesura e revisione del testo a partire d'analisi del compito di scrittura.Realizzare scelte lessicali adeguate, in relazione allo scopo comunicativo e al destinatario.
@Scrivere testi di vario tipo, corretti dal punto di vista morfosintattico, lessicale, ortografico. Scrivere testi di tipo diverso, coerenti e coesi, adeguati allo scopo e al destinatario. Applicare con sicurezza le procedure di ideazione, pianificazione, stesura e revisione del testo a partire d'analisi del compito di scrittura. Adattare opportunamente i registri linguistici in base alla situazione comunicativa e agli interlocutori, realizzando le opportune scelte lessicali.





