@- Legge e comprende il significato generale di un testo individuandone le parole-chiave.@- Organizza e memorizza i contenuti essenziali della Storia della letteratura italiana.@- Riconosce le strutture fondamentali di un testo e gli elementi essenziali della poetica delle opere studiate.@- Espone in forma chiara, corretta e coesa i contenuti essenziali.@- Applica, guidato dal docente, modalità di analisi tematica e stilistica.@- Produce testi orali e scritti di diversa tipologia, organizzando il discorso in funzione della situazione comunicativa e in una forma sufficientemente corretta e coerente.
@- Legge e comprende il significato generale di un testo, ne individua le parole-chiave e ne coglie le relazioni fra le sue parti.@- Organizza e memorizza i contenuti della Storia della letteratura italiana, talvolta stabilendo confronti essenziali tra autori e opere.@- Riconosce le strutture fondamentali di un testo, comprende le principali intenzioni comunicative dell’autore e gli svariati elementi della poetica delle opere studiate.@- Espone in forma chiara, corretta e coesa i contenuti nella loro completezza, operando collegamenti interdisciplinari guidato dal docente.@- Applica, in maniera essenziale, modalità di analisi tematica e stilistica.@- Produce testi orali e scritti di diversa tipologia, organizzando il discorso in funzione della situazione comunicativa e in una forma sufficientemente corretta, coerente e coesa.@- Propone semplici valutazioni personali.
@- Evince dalla lettura dei testi o dei brani proposti gli elementi costitutivi della poetica e dell’ideologia degli autori.@- Contestualizza opere ed autori, individuando le relazioni fra fatto letterario e contesto storicoculturale italiano ed europeo.@- Individua le relazioni fra testi dello stesso autore, fra autori diversi e fra differenti forme artistiche.@- Coglie i caratteri specifici di un testo letterario e applica adeguate modalità di analisi tematica e stilistica.@- Padroneggia le strutture morfo-sintattiche e lessicali della lingua italiana per l’analisi letteraria e per l’uso linguistico vivo.@- Produce testi orali e scritti di diversa tipologia, organizzando il discorso in funzione della situazione comunicativa e in forma corretta, coerente e coesa.





