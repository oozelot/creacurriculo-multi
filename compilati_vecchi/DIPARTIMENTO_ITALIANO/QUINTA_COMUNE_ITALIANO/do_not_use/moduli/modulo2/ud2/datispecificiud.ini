@- Legge e comprende il significato generale di un testo, ne individua le parole-chiave e ne coglie le relazioni fra le sue parti.@- Organizza e memorizza i contenuti della Storia della letteratura italiana, talvolta stabilendo confronti essenziali tra autori e opere.@- Riconosce le strutture fondamentali di un testo, comprende le principali intenzioni comunicative dell’autore e gli svariati elementi della poetica delle opere studiate.@- Espone in forma chiara, corretta e coesa i contenuti nella loro completezza, operando collegamenti interdisciplinari guidato dal docente.@- Applica, in maniera essenziale, modalità di analisi tematica e stilistica.@- Produce testi orali e scritti di diversa tipologia, organizzando il discorso in funzione della situazione comunicativa e in una forma sufficientemente corretta, coerente e coesa.@- Propone semplici valutazioni personali.
@- Legge e comprende il significato di un testo, individua le parole-chiave, coglie relazioni fra le parti e lo interpreta anche grazie a informazioni esterne.@- Organizza i contenuti di Storia della letteratura, con confronti tra autori, opere e differenti forme artistiche.@- Riconosce nel testo gli elementi della poetica e dell’ideologia degli autori.@- Contestualizza opere e autori, individua relazioni nel contesto storico-culturale.@- Coglie i caratteri specifici di un testo e applica modalità di analisi tematica e stilistica con collegamenti interdisciplinari.@- Padroneggia le strutture morfo-sintattiche e lessicali della lingua per l’analisi letteraria e l’uso linguistico vivo.@- Produce testi orali e scritti di varia tipologia, elaborando il discorso secondo la situazione comunicativa e in forma corretta, coerente e coesa.@- Propone argomentate valutazioni personali.





