IL GIOCO
@Eseguire i fondamentali individuali di alcune attività sportive, nei ruoli congeniali alle proprie attitudini e propensioni, mettendo in pratica semplici azioni di gioco e/o semplici schemi squadra.  Tecnica e tattica dei fondamentali individuali della pallavolo, basket, calcio a 5, Palla tamburello, ultimate frisbee.  Fondamentali di squadra, situazioni di gioco e schemi tattici. Compiti di arbitraggio.  Giochi propedeutici e presportivi (pallatutto, pallarilanciata, pallaprigioniera, dodgeball, ecc..).  Pratica di attività sportive di squadra e individuali (tennis tavolo e badminton), che implichino il rispetto di regole, di ruoli e di schemi di gioco e compiti di arbitraggio.  Esercizi a corpo libero e con attrezzi, intesi a far conseguire all'alunno la consapevolezza dei propri mezzi e a superare eventuali remore immotivate; in modo da promuovere in tutti gli studenti, anche nei meno dotati, favorire l'abitudine alla pratica motoria e sportiva. Le molteplici opportunità offerte dallo sport favoriscono I'assunzione di ruoli diversi e di responsabilità specifiche (di arbitraggio, organizzativi, progettuali), promuovendo una maggiore capacità di decisione, giudizio e autovalutazione. L'attività motoria realizzata in ambiente naturale costituisce occasione per il recupero di un rapporto corretto dell'uomo con l'ambiente.
