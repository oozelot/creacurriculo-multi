IL GIOCO
@Eseguire i fondamentali individuali di alcune attività sportive, nei ruoli congeniali alle proprie attitudini e propensioni, mettendo in pratica semplici azioni di gioco e/o semplici schemi squadra. Fondamentali dei principali sport di squadra, situazioni di gioco e semplici schemi tattici. Compiti di arbitraggio.  Giochi propedeutici e presportivi. Pratica di attività sportive di squadra e individuali (tennis tavolo e badminton), che implichino il rispetto di regole, di ruoli e di schemi di gioco. Esercizi a corpo libero e con attrezzi, intesi a far conseguire all'alunno la consapevolezza dei propri mezzi e a superare eventuali remore immotivate; in modo da promuovere in tutti gli studenti, anche nei meno dotati, favorire l'abitudine alla pratica motoria e sportiva. Le molteplici opportunità offerte dallo sport favoriscono I'assunzione di ruoli diversi e di responsabilità specifiche (di arbitraggio, organizzativi, progettuali), promuovendo una maggiore capacità di decisione, giudizio e autovalutazione. L'attività motoria realizzata in ambiente naturale costituisce occasione per il recupero di un rapporto corretto dell'uomo con l'ambiente.
