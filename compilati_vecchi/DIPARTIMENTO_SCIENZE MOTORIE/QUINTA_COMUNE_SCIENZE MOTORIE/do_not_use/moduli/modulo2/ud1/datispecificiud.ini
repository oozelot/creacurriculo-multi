ABILITA' MOTORIE
@Esercizi per il potenziamento generale (preatletici, andature, esercizi di tonificazione dorsale e addominale esercizi a coppie, esercizi di preacrobatica).  Esercizi a corpo libero a carico naturale e/o da un carico addizionale di entità adeguata; con opposizione di resistenza; esercizi di sollevamento e trasporto. Circuiti, percorsi a stazioni, piccole progressioni con e senza attrezzi.   Esercizi per l'incremento della velocità (tecnica di corsa, corsa veloce, scatti).  Esercitazioni mobilizzanti a carico naturale e con piccoli attrezzi; allungamento muscolare (stretching).   Esercizi per il miglioramento della funzione cardio-circolatoria e respiratoria. Corsa ed esercizi di resistenza a carattere prevalentemente aerobico, ricerca graduale dell'aumento di resistenza, corsa in ambiente naturale; corsa con supporto musicale, corsa intervallata con superamento ostacoli ed elementi di media difficoltà.  Esercizi con piccoli attrezzi quali: palle, cerchi, bacchette, funicelle.
