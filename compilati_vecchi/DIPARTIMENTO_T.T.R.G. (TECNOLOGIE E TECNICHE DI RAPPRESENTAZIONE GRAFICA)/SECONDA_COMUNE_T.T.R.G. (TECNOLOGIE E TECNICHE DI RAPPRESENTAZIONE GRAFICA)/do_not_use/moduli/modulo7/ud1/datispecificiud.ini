@Lo studente gestisce le caratteristiche del disegno con il CAD in maniera non sempre autonoma, conosce e utilizza i principali comandi di disegno e modifica di un programma CAD per realizzare disegni semplici, applica quotature, retini e blocchi in maniera elementare, organizza e gestisce l'elaborato con pochi layers, necessita di lunghi tempi di esecuzione dell'elaborato grafico computerizzato.
@Lo studente gestisce le caratteristiche del disegno con CAD in maniera consapevole, conosce ed utilizza i principali comandi di disegno e modifica di un programma CAD per ralizzare disegni di media complessità, applica quotature, retini e blocchi in maniera opportuna, organizza e gestisce l'elaborato con diversi layers, necessita di tempi medi di esecuzione dell'elaborato grafico computerizzato.
@Lo studente gestisce le caratteristiche del disegno con il CAD in maniera autonoma, conosce e utilizza in maniera approfondita i comandi di disegno e modifica di un programma CAD per realizzare disegni complessi; individua combinazioni di comandi, personalizza applica e crea quotature, retini e blocchi in maniera opportuna, organizza e gestisce l'elaborato con molti layers, propone e realizza disegni originali, dimostra velocità di esecuzione dell'elaborato grafico computerizzato. Utilizza quotature, retini e blocchi in maniera opportuna. Organizza e gestisce l'elaborato con diversi layers e necessita di tempi brevi di esecuzione, riuscendo comunque ad ottenere precisione e correttezza.





