@IMPEGNO E PARTECIPAZIONE NON COSTANTI, talvolta si distrae in classe;@ACQUISIZIONE CONOSCENZE@ha conoscenze non approfondite e commette qualche errore nella comprensione;@ELABORAZIONI CONOSCENZE@applica le conoscenze commettendo degli errori, sia nell'applicazione che nell'analisi;@AUTONOMIA NELLA RIELABORAZIONE CRITICA DELLE CONOSCENZE@non ha autonomia nella rielaborazione delle conoscenze, coglie solo parzialmente gli aspetti essenziali;@ABILITÀ GRAFICHE ED ESPRESSIVE@commette qualche errore nel disegno, nella scelta del tipo di segno e nella quotatura dei disegni;
@IMPEGNO E PARTECIPAZIONE DISCRETI@ACQUISIZIONE CONOSCENZE@ha conoscenze che gli permettono di svolgere correttamente compiti di media complessità;@ELABORAZIONI CONOSCENZE@sa selezionare i tipi di linea e le modalità di stampa in rapporto al loro impiego,@applica le metodologie del disegno CAD nella redazione degli elaborati, con qualche imprecisione;@AUTONOMIA NELLA RIELABORAZIONE CRITICA DELLE CONOSCENZE@è autonomo nella sintesi, ma non approfondisce gli argomenti;@ABILITÀ GRAFICHE ED ESPRESSIVE@disegna in modo leggibile usando la simbologia corretta;
