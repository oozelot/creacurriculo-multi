@Analizzare le singole fonti ma non in maniera consapevole. Comprendere il cambiamento e la diversità dei tempi storici in una dimensione diacronica attraverso il confronto fra epoche e civiltà  ma non in una dimensione sincronica attraverso il confronto fra aree geografiche e culturali. Mettere l'evento in relazione al contesto storico ma non a quello geografico. Usare in maniera sufficientemente appropriata il lessico base della storiografia.
@Analizzare le singole fonti in maniera corretta. Comprendere il cambiamento e la diversità dei tempi storici in una dimensione diacronica attraverso il confronto fra epoche e civiltà ma solo in parte in una dimensione sincronica attraverso il confronto fra aree geografiche e culturali. Mettere l'evento in relazione al contesto storico e geografico in modo essenziale. Usare adeguatamente il lessico base della storiografia.
@Analizzare le singole fonti in maniera autonoma e consapevole . Comprendere il cambiamento e la diversità dei tempi storici in una dimensione diacronica attraverso il confronto fra epoche e civiltà in una  dimensione sincronica attraverso il confronto fra aree geografiche e culturali. Mettere l'evento in relazione al contesto storico e geografico. Usare in maniera sempre appropriata il lessico della storiografia.





