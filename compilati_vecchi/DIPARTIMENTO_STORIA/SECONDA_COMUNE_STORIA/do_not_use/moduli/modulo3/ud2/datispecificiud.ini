@Conoscere e comprendere in modo essenziale i fatti storici. Ordinare gli eventi individuandone  cause e conseguenze evidenti e basilari. Usare le fonti in modo essenziale per ricostruire i fenomeni storici. Orientarsi nella dimensione spazio/temporale operando semplici collegamenti. Organizzare in modo abbastanza semplice e coerente le informazioni (esplicite) individuate nel testo storico in modo abbastanza autonomo. Usare il linguaggio specifico della disciplina in modo sufficientemente corretto.
