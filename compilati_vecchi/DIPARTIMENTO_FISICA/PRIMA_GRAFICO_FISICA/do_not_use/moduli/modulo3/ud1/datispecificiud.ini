@Solo se guidato:@- individua e distingue grandezze scalari e vettoriali, associando la corretta unità di misura@- calcola il modulo della somma di due vettori che giacciono sulla stessa retta o su rette perpendicolari@- applica la regola del parallelogramma/punta-coda a due vettori: disegnare direzione e verso del vettore somma@- distingue i concetti di massa, peso @- rappresenta graficamente le forze@- descrive (direzione, verso e modulo) delle forze@- riconosce il significato di baricentro@- riconosce il ruolo dei vincoli (reazione di un filo, di un piano orizzontale e inclinato)@- ricava formule inverse@- disegna e calcola le componenti del vettore forza peso lungo un piano inclinato@- risolve semplici esercizi sulla statica del punto materiale, applicando la condizione di equilibrio per la traslazione
