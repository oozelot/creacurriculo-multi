name: Compila Multi-Piattaforma

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compila per ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Configura Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Installa dipendenze e PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m pip install pyinstaller
      shell: bash

    - name: Installa dipendenze Windows
      if: runner.os == 'Windows'
      run: python -m pip install pywin32

    - name: Esegui PyInstaller
      run: |
        python tools/pulisci_build.py
        python -m PyInstaller --clean --noconfirm CreaCurricolo.spec

    - name: Salva l'eseguibile come pacchetto
      uses: actions/upload-artifact@v5
      with:
        name: eseguibile-creacurricolomulti-${{ matrix.os }}
        path: dist/

    - name: Crea archivio di distribuzione
      run: |
        python -c "import shutil; shutil.make_archive('CreaCurricoloMulti-${{ matrix.os }}', 'zip', 'dist', 'CreaCurricoloMulti')"

    - name: Salva archivio di distribuzione
      uses: actions/upload-artifact@v4
      with:
        name: pacchetto-creacurricolomulti-${{ matrix.os }}
        path: CreaCurricoloMulti-${{ matrix.os }}.zip

  release:
    name: Pubblica release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Scarica gli archivi multipiattaforma
      uses: actions/download-artifact@v5
      with:
        pattern: pacchetto-creacurricolomulti-*
        path: release
        merge-multiple: true

    - name: Pubblica la release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" release/*.zip --generate-notes --title "CreaCurricoloMulti ${{ github.ref_name }}"