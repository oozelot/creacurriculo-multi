name: Compila Multi-Piattaforma

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compila per ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            runner: windows-2022
            python-version: '3.13.16'
          - os: ubuntu-latest
            runner: ubuntu-latest
            python-version: '3.10.22'
          - os: macos-latest
            runner: macos-latest
            python-version: '3.13.16'

    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v5

    - name: Imposta l'epoca deterministica della build
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      shell: bash

    - name: Configura Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Installa dipendenze e PyInstaller
      if: runner.os != 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m pip install pyinstaller
      shell: bash

    - name: Installa dipendenze Windows bloccate
      if: runner.os == 'Windows'
      run: python -m pip install --require-hashes -r requirements-build-windows.txt

    - name: Esegui PyInstaller
      if: runner.os != 'macOS'
      env:
        PYTHONHASHSEED: '0'
      run: |
        python tools/pulisci_build.py
        python -m PyInstaller --clean --noconfirm CreaCurricolo.spec
        python -m compileall -q main.py curricolo

    - name: Prepara il pacchetto macOS con Python ufficiale
      if: runner.os == 'macOS'
      run: |
        python tools/pulisci_build.py
        python -m compileall -q main.py curricolo tools/avvia_mac.py
        python tools/prepara_dist.py dist/CreaCurricoloMulti --macos-sorgente

    - name: Prepara gli archivi iniziali della distribuzione
      if: runner.os != 'macOS'
      run: python tools/prepara_dist.py dist/CreaCurricoloMulti

    - name: Verifica pacchetto prodotto
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          test -f "dist/CreaCurricoloMulti/Avvia CreaCurricolo.command"
          test -f "dist/CreaCurricoloMulti/main.py"
          test -f "dist/CreaCurricoloMulti/curricolobak-modificato.db"
          test ! -e "dist/CreaCurricoloMulti/dati/curricolo.db"
          test ! -e "dist/CreaCurricoloMulti/DIPARTIMENTO_DIRITTO"
        else
          test -f "dist/CreaCurricoloMulti/CreaCurricoloMulti${{ runner.os == 'Windows' && '.exe' || '' }}"
          test -d "dist/CreaCurricoloMulti/_internal"
        fi
      shell: bash

    - name: Rendi eseguibile il launcher Unix
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          chmod +x "dist/CreaCurricoloMulti/Avvia CreaCurricolo.command"
        else
          chmod +x dist/CreaCurricoloMulti/CreaCurricoloMulti
        fi
      shell: bash

    - name: Salva l'eseguibile come pacchetto
      uses: actions/upload-artifact@v5
      with:
        name: eseguibile-creacurricolomulti-${{ matrix.os }}
        path: dist/

    - name: Crea archivio di distribuzione
      run: python tools/archivia_dist.py dist/CreaCurricoloMulti CreaCurricoloMulti-${{ matrix.os }}.zip
      shell: bash

    - name: Salva archivio di distribuzione
      uses: actions/upload-artifact@v4
      with:
        name: pacchetto-creacurricolomulti-${{ matrix.os }}
        path: CreaCurricoloMulti-${{ matrix.os }}.zip

  release:
    name: Pubblica release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5

    - name: Scarica gli archivi multipiattaforma
      uses: actions/download-artifact@v5
      with:
        pattern: pacchetto-creacurricolomulti-*
        path: release
        merge-multiple: true

    - name: Pubblica la release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" release/*.zip --generate-notes --title "CreaCurricoloMulti ${{ github.ref_name }}"